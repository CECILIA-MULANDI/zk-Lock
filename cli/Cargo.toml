[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
ckb-sdk = "5.1.0"
clap = { version = "4.6.6", features = ["derive", "env"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0.104"
hex = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
ckb-types = "1.1.3"
secp256k1 = "0.29"
ckb-hash = "1.1.1"
ckb-jsonrpc-types = "1.2.0"
