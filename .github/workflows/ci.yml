name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64imac-unknown-none-elf
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # ckb-std compiles the CKB C standard library from source, and the
      # contract Makefile derives llvm-ar and llvm-objcopy from the clang path
      # by string substitution, so clang, llvm-ar and llvm-objcopy all have to
      # sit in one directory.
      #
      # The runner image already ships several LLVM versions, so prefer those
      # and touch the network only if none of them is usable. `apt-get` here
      # was failing to resolve its mirror, which has nothing to do with this
      # repository and should not be able to fail a build.
      #
      # `scripts/find_clang` returns $CLANG verbatim when it is set, so putting
      # it in the environment is enough for every later step.
      - name: Locate the LLVM toolchain
        run: |
          for dir in /usr/lib/llvm-20 /usr/lib/llvm-19 /usr/lib/llvm-18 \
                     /usr/lib/llvm-17 /usr/lib/llvm-16; do
            if [ -x "$dir/bin/clang" ] \
               && [ -x "$dir/bin/llvm-ar" ] \
               && [ -x "$dir/bin/llvm-objcopy" ]; then
              echo "using $dir"
              echo "CLANG=$dir/bin/clang" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no preinstalled LLVM found, falling back to apt"
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y clang llvm && exit 0
            echo "apt attempt $attempt failed"
            sleep 20
          done
          exit 1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Build contracts and native simulators
        run: make build

      - name: Test
        run: make test

      - name: Clippy
        run: make clippy CARGO_ARGS="-- -D warnings"

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/ts/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # npm run e2e is excluded on purpose: it needs a funded Pudge key.
      - name: Test
        run: npm test
